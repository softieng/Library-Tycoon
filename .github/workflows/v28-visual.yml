name: V2.8 Art-First 3D Validation
on:
  push:
    branches:
      - feature/v28-real-assets-reading-hall
    paths:
      - "v28/**"
      - ".github/workflows/v28-visual.yml"
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check gameplay and contracts
        run: node --test v28/tests/*.cjs
      - name: Validate all imported GLB assets
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const manifest = require('./v28/MODEL_MANIFEST.json');
          let total = 0;
          for (const name of manifest.glb) {
            const b = fs.readFileSync('v28/assets/' + name + '.glb');
            if (b.toString('utf8',0,4) !== 'glTF' || b.readUInt32LE(8) !== b.length) throw Error('Invalid GLB: '+name);
            total += b.length;
          }
          console.log('GLB validated: '+manifest.glb.length+' items, '+total+' bytes');
          JS
      - name: Start local static web server
        run: |
          python3 -m http.server 8765 >/tmp/library-http.log 2>&1 &
          echo $! >/tmp/library-http.pid
          sleep 2
          curl -fsSL http://127.0.0.1:8765/v28/ >/dev/null
      - name: Browser WebGL smoke and screenshot
        shell: bash
        run: |
          set -o pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then echo "Chrome not found" && exit 1; fi
          "$BROWSER" --version
          mkdir -p /tmp/visual
          timeout 120 "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --enable-webgl --use-gl=angle --use-angle=swiftshader --window-size=1600,1000 --virtual-time-budget=30000 --dump-dom http://127.0.0.1:8765/v28/ >/tmp/visual/dom.html 2>/tmp/visual/chrome.log
          if ! grep -Eq '22 / 22|22/22' /tmp/visual/dom.html; then
            echo "GLB load progress not complete"; tail -c 1200 /tmp/visual/dom.html; exit 1
          fi
          if grep -q 'تعذّر عرض المشهد' /tmp/visual/dom.html; then echo "WebGL scene failed"; exit 1; fi
          timeout 120 "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --enable-webgl --use-gl=angle --use-angle=swiftshader --window-size=1600,1000 --virtual-time-budget=30000 --screenshot=/tmp/visual/reading-hall.png http://127.0.0.1:8765/v28/ >/tmp/visual/screenshot.log 2>&1
          test -s /tmp/visual/reading-hall.png
          echo '3D scene loaded and screenshot created'
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-tycoon-v28-visual
          path: |
            /tmp/visual/reading-hall.png
            /tmp/visual/dom.html
            /tmp/visual/chrome.log
          retention-days: 7
